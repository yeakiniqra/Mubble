<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="body" x1="96" y1="64" x2="416" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff6a88"/>
      <stop offset="0.5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#3b6cff"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="56" x2="0" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- the bubble -->
  <circle cx="256" cy="256" r="224" fill="url(#body)"/>
  <ellipse cx="256" cy="168" rx="168" ry="112" fill="url(#sheen)"/>
  <circle cx="256" cy="256" r="221" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="6"/>
  <!-- the sound inside it: same four bars as the tray icon -->
  <g fill="#ffffff">
    <rect x="142" y="208" width="36" height="96"  rx="18"/>
    <rect x="206" y="152" width="36" height="208" rx="18"/>
    <rect x="270" y="182" width="36" height="148" rx="18"/>
    <rect x="334" y="220" width="36" height="72"  rx="18"/>
  </g>
</svg>
